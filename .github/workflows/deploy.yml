name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need OIDC + write access; one deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Repo name; Pages serves the site under /Gravity/.
  PAGES_BASE: /Gravity/

jobs:
  checks:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation-engine

      - name: Cargo test
        working-directory: simulation-engine
        # Skip the two known failures (see sim.rs); run all other gates.
        run: >
          cargo test --release --
          --skip energy_drift_bounded
          --skip time_reversal_roundtrip

      - name: Clippy
        working-directory: simulation-engine
        run: cargo clippy --release --all-targets -- -D warnings

  build-and-deploy:
    name: Build and deploy
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: simulation-engine

      - name: Install wasm-pack
        # Pinned direct download. The action 404s on this version.
        run: |
          curl -fsSL \
            https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.13.1/wasm-pack-v0.13.1-x86_64-unknown-linux-musl.tar.gz \
            -o /tmp/wasm-pack.tgz
          tar -xzf /tmp/wasm-pack.tgz -C /tmp
          sudo mv /tmp/wasm-pack-v0.13.1-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/
          wasm-pack --version

      - name: Build wasm engine
        run: wasm-pack build simulation-engine --target web --release

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs after the wasm build so the generated pkg modules typecheck.
      - name: Svelte check
        run: pnpm exec svelte-check --tsconfig ./tsconfig.json

      - name: Build site
        run: pnpm exec vite build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
